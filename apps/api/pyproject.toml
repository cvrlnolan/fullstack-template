[project]
name = "api"
version = "0.0.0"
description = "FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]==0.143.0",
  "pydantic-settings==2.15.0",
  "anthropic==1.13.0",
  "sqlalchemy==2.1.4",
  "asyncpg==0.32.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
