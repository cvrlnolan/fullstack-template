services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports: ["3000:3000"]
    environment:
      API_URL: http://api:8000
    volumes:
      - ./apps/web:/repo/apps/web
      - ./packages:/repo/packages
      - /repo/packages/api-client/node_modules
      - /repo/packages/ui/node_modules
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - /repo/apps/web/.next
    depends_on: [api]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD:-app}@db:5432/app
    volumes:
      - ./apps/api:/repo/apps/api
    depends_on:
      db: { condition: service_healthy }

  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
